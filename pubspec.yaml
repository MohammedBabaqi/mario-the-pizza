name: mario
description: "MARIO — Premium Pizza Delivery App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management (MVVM with Provider)
  provider: ^6.1.2
  equatable: ^2.0.8

  # Routing
  go_router: ^17.2.3

  # HTTP Client
  http: ^1.2.1

  # UI
  google_fonts: ^8.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Local Storage
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.20.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
